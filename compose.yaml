services:
    bento-web:
        build: .
        image: bento-web:local
        ports:
            - '127.0.0.1:8080:8080'
        env_file:
            - ./runtime/web.env
        environment:
            BENTO_ONE_ACCOUNTS_FILE: /run/bento/accounts.json
            BENTO_MYSQL_HOST: mysql:3306
            BENTO_MYSQL_USER: bento
            BENTO_MYSQL_DATABASE: bento
            BENTO_MYSQL_PASSWORD: ${BENTO_MYSQL_PASSWORD:?Set BENTO_MYSQL_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - type: bind
              source: ./runtime/accounts.json
              target: /run/bento/accounts.json
              read_only: true
              bind:
                  create_host_path: false
            - bento-web-data:/data
        stop_grace_period: 60s
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: bento
            MYSQL_USER: bento
            MYSQL_PASSWORD: ${BENTO_MYSQL_PASSWORD:?Set BENTO_MYSQL_PASSWORD}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        healthcheck:
            test:
                - CMD-SHELL
                - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1'
            interval: 5s
            timeout: 5s
            retries: 20
        volumes:
            - bento-mysql-data:/var/lib/mysql
        restart: unless-stopped

volumes:
    bento-web-data:
    bento-mysql-data:
