<!doctype html>
<html lang="zh-CN" data-mode="__MODE__">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bento · 任务工作台</title>
        <link rel="stylesheet" href="/style.css" />
        <script src="/client.js" defer></script>
    </head>
    <body>
        <header class="top">
            <a class="brand" href="/">Bento</a>
            <span id="mode" class="badge">任务工作台</span>
            <span class="spacer"></span>
            <span id="account"></span>
            <button id="logout" class="secondary" type="button" hidden>
                退出
            </button>
        </header>
        <main>
            <p id="notice" class="notice" role="status" hidden></p>
            <section id="login-screen" class="panel login" hidden>
                <p class="eyebrow">受邀访问</p>
                <h1>登录任务工作台</h1>
                <p class="muted">导入文本项目，提交任务，回来查看执行结果。</p>
                <p id="demo-hint" class="hint" hidden>
                    本地模拟账号 demo 或 guest，邀请码 demo-invite。
                </p>
                <form id="login-form">
                    <label
                        >账号
                        <input name="account" autocomplete="username" required
                    /></label>
                    <label
                        >邀请码
                        <input
                            name="invite"
                            type="password"
                            autocomplete="current-password"
                            required
                    /></label>
                    <button type="submit">登录</button>
                </form>
            </section>
            <section id="workspace" hidden>
                <div class="intro">
                    <div>
                        <p class="eyebrow">工作空间</p>
                        <h1>项目与任务</h1>
                        <p class="muted">
                            任务提交后在后台执行。重新打开页面即可查看进度和成果。
                        </p>
                    </div>
                    <button id="refresh" class="secondary" type="button">
                        刷新状态
                    </button>
                </div>
                <div class="layout">
                    <aside class="panel">
                        <h2>项目</h2>
                        <ul id="projects" class="project-list"></ul>
                        <details id="import-panel">
                            <summary>导入文本项目</summary>
                            <form id="import-form">
                                <label
                                    >项目名称 <input name="name" required
                                /></label>
                                <label
                                    >选择多个文件
                                    <input name="files" type="file" multiple
                                /></label>
                                <label
                                    >或选择一个文件夹
                                    <input
                                        name="folder"
                                        type="file"
                                        webkitdirectory
                                        multiple
                                /></label>
                                <p class="hint">
                                    仅 UTF-8 文本，最多 100 个文件及 1 MiB
                                    文本。文件夹导入保留相对路径。
                                </p>
                                <button type="submit">导入</button>
                            </form>
                        </details>
                    </aside>
                    <section class="panel">
                        <div id="empty-project" class="empty">
                            导入或选择一个项目以开始。
                        </div>
                        <div id="project-detail" hidden>
                            <div class="row">
                                <h2 id="project-name"></h2>
                                <span id="project-status" class="badge"></span>
                            </div>
                            <form id="task-form">
                                <label
                                    >任务描述
                                    <textarea
                                        name="prompt"
                                        rows="4"
                                        required
                                        placeholder="例如：在 README 末尾补一段使用说明。"
                                    ></textarea>
                                </label>
                                <p id="task-hint" class="hint"></p>
                                <div class="row">
                                    <button id="submit-task" type="submit">
                                        提交任务
                                    </button>
                                    <button
                                        id="forget-pending"
                                        class="secondary"
                                        type="button"
                                        hidden
                                    >
                                        清除待重试记录
                                    </button>
                                </div>
                            </form>
                            <div class="runs">
                                <h2>运行记录</h2>
                                <ul id="runs" class="run-list"></ul>
                            </div>
                            <section id="diff-panel" class="diff" hidden>
                                <div class="row">
                                    <h3>diff 预览</h3>
                                    <a
                                        id="download"
                                        class="secondary"
                                        download="bento.diff"
                                        hidden
                                        >下载 diff</a
                                    >
                                </div>
                                <p id="diff-status" role="status"></p>
                                <pre id="diff-text" tabindex="0" hidden></pre>
                            </section>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </body>
</html>
