worker_processes 1;
worker_shutdown_timeout 35s;
pid /tmp/bento-nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format bento '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout bento;
    sendfile on;

    client_body_temp_path /tmp/bento-nginx-client;
    proxy_temp_path /tmp/bento-nginx-proxy;
    fastcgi_temp_path /tmp/bento-nginx-fastcgi;
    uwsgi_temp_path /tmp/bento-nginx-uwsgi;
    scgi_temp_path /tmp/bento-nginx-scgi;

    map $http_x_forwarded_proto $bento_public_scheme {
        default $scheme;
        https https;
    }

    server {
        listen 8080;
        root /srv/bento;
        client_max_body_size 8m;
        client_header_timeout 30s;
        client_body_timeout 30s;

        location = /api {
            return 404;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:4102;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 35s;
        }

        location ~ ^/auth(?:/|$) {
            proxy_pass http://127.0.0.1:4102;
            proxy_set_header Host $http_host;
        }

        location ^~ /identity/ {
            # Resolve only when this route is used, so the image can run alone in mock mode.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $identity_upstream http://keycloak:8080;
            proxy_pass $identity_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $bento_public_scheme;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~* \.(?:css|js|mjs|svg|ico|png|webp|woff2?)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
