worker_processes 1;
worker_shutdown_timeout 35s;
pid /tmp/bento-nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/bento-nginx-client;
    proxy_temp_path /tmp/bento-nginx-proxy;
    fastcgi_temp_path /tmp/bento-nginx-fastcgi;
    uwsgi_temp_path /tmp/bento-nginx-uwsgi;
    scgi_temp_path /tmp/bento-nginx-scgi;

    server {
        listen 8080;
        root /srv/bento;
        client_max_body_size 8m;
        client_header_timeout 30s;
        client_body_timeout 30s;

        location = /api {
            return 404;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:4101;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 35s;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~* \.(?:css|js|mjs|svg|ico|png|webp|woff2?)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
