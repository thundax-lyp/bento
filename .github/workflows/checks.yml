name: Checks

on:
    pull_request:
        branches: [main, 'codex/**']
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect affected paths
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            workspace: ${{ steps.paths.outputs.workspace }}
            orchestrator: ${{ steps.paths.outputs.orchestrator }}
            worker: ${{ steps.paths.outputs.worker }}
            worker_reuse: ${{ steps.paths.outputs.worker_reuse }}
            browser: ${{ steps.paths.outputs.browser }}
            space: ${{ steps.paths.outputs.space }}
            queue: ${{ steps.paths.outputs.queue }}
            temporal: ${{ steps.paths.outputs.temporal }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - id: paths
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  workspace=false
                  orchestrator=false
                  worker=false
                  worker_reuse=false
                  browser=false
                  space=false
                  queue=false
                  temporal=false

                  changed_paths=$(mktemp)
                  # PRs compare the complete merge result; main compares the pushed range.
                  # Renames check both the old and new paths.
                  if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
                      git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- > "$changed_paths"
                      while IFS= read -r -d '' path; do
                          case "$path" in
                              *.md|assets/*|public-files.json) ;;
                              apps/workspace/web/acceptance/web-space-integrity.spec.ts|apps/workspace/web/acceptance/space-integrity-fixture.ts|apps/workspace/web/playwright.web-space-integrity.config.ts)
                                  workspace=true
                                  space=true
                                  ;;
                              apps/workspace/web/acceptance/web-queue-isolation.spec.ts|apps/workspace/web/acceptance/queue-*-fixture.ts|apps/workspace/web/playwright.web-queue-isolation.config.ts)
                                  workspace=true
                                  queue=true
                                  ;;
                              apps/workspace/web/e2e/*|apps/workspace/web/playwright.config.ts)
                                  workspace=true
                                  browser=true
                                  ;;
                              apps/workspace/*|deploy/workspace/*|deploy/keycloak/*)
                                  workspace=true
                                  browser=true
                                  space=true
                                  queue=true
                                  ;;
                              apps/orchestrator/tests/execution-service/*|apps/orchestrator/src/control/temporal_test.go|apps/orchestrator/src/control/temporal_fair_entry_test.go)
                                  workspace=true
                                  orchestrator=true
                                  queue=true
                                  temporal=true
                                  ;;
                              apps/orchestrator/*|deploy/orchestrator/*)
                                  # API tests and queue acceptance import Orchestrator.
                                  workspace=true
                                  orchestrator=true
                                  worker_reuse=true
                                  queue=true
                                  temporal=true
                                  ;;
                              apps/worker/*|deploy/worker/*)
                                  workspace=true
                                  orchestrator=true
                                  worker_reuse=true
                                  worker=true
                                  queue=true
                                  temporal=true
                                  ;;
                              *)
                                  workspace=true
                                  orchestrator=true
                                  worker_reuse=true
                                  worker=true
                                  browser=true
                                  space=true
                                  queue=true
                                  temporal=true
                                  ;;
                          esac
                      done < "$changed_paths"
                  else
                      # Unknown scope must run every check.
                      workspace=true
                      orchestrator=true
                      worker_reuse=true
                      worker=true
                      browser=true
                      space=true
                      queue=true
                      temporal=true
                  fi

                  for check in workspace orchestrator worker worker_reuse browser space queue temporal; do
                      printf '%s=%s\n' "$check" "${!check}" >> "$GITHUB_OUTPUT"
                  done

    repository:
        name: Repository checks
        needs: changes
        if: ${{ always() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Verify path detection
              if: ${{ needs.changes.result != 'success' }}
              run: exit 1
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Reject tracked Python files
              shell: bash
              run: |
                  python_files="$(git ls-files -- ':(glob,icase)**/*.py')"
                  if [[ -n "$python_files" ]]; then
                      printf 'Python files are outside the Bento source tree:\n%s\n' "$python_files" >&2
                      exit 1
                  fi
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check:workspace
              if: ${{ needs.changes.outputs.workspace == 'true' }}
            - run: pnpm --filter @bento/orchestrator check:core:fast
              if: ${{ needs.changes.outputs.orchestrator == 'true' }}
            - run: pnpm --filter @bento/orchestrator test:worker-reuse
              if: ${{ needs.changes.outputs.worker_reuse == 'true' }}
            - run: pnpm check:worker
              if: ${{ needs.changes.outputs.worker == 'true' }}
            - run: pnpm lint
              if: >-
                  ${{ needs.changes.outputs.workspace == 'true' ||
                      needs.changes.outputs.orchestrator == 'true' ||
                      needs.changes.outputs.worker == 'true' }}
            - run: pnpm format:check

    browser:
        name: Web Chromium E2E
        needs: changes
        if: >-
            ${{ needs.changes.outputs.browser == 'true' ||
                needs.changes.outputs.space == 'true' ||
                needs.changes.outputs.queue == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Use Ubuntu HTTPS package mirrors
              shell: bash
              run: |
                  # Regional HTTP mirrors caused multi-minute apt downloads in recent runs.
                  sudo sed -i -E \
                      's|http://([a-z0-9.-]+\.)?archive.ubuntu.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g; s|http://security.ubuntu.com/ubuntu/?|https://security.ubuntu.com/ubuntu/|g' \
                      /etc/apt/sources.list.d/ubuntu.sources
            - run: pnpm --filter @bento/web exec playwright install --with-deps --only-shell chromium
            - run: pnpm --filter @bento/web test:e2e
              if: ${{ needs.changes.outputs.browser == 'true' }}
            - run: pnpm --filter @bento/web test:space-integrity
              if: ${{ needs.changes.outputs.space == 'true' }}
            - run: pnpm --filter @bento/web test:queue-isolation
              if: ${{ needs.changes.outputs.queue == 'true' }}

    temporal:
        name: Temporal retry acceptance
        needs: changes
        if: ${{ needs.changes.outputs.temporal == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 22.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Fetch pinned official Temporal archive
              id: temporal-archive
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  umask 077
                  directory=$(mktemp -d "$RUNNER_TEMP/bento-temporal.XXXXXXXX")
                  trap 'status=$?; if (( status != 0 )); then rm -rf -- "$directory"; fi' EXIT
                  chmod 700 "$directory"
                  printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
                  archive="$directory/temporal_cli_1.5.1_linux_amd64.tar.gz"
                  if ! timeout 120s gh release download v1.5.1 --repo temporalio/cli \
                      --pattern temporal_cli_1.5.1_linux_amd64.tar.gz --output "$archive" \
                      > /dev/null 2> "$directory/download-error"; then
                      printf 'Pinned official Temporal download failed.\n' >&2
                      exit 1
                  fi
                  rm -- "$directory/download-error"
                  [[ -f "$archive" && ! -L "$archive" ]] || exit 1
                  chmod 600 "$archive"
                  [[ $(find "$directory" -mindepth 1 -maxdepth 1 | wc -l) -eq 1 ]] || exit 1
                  [[ $(stat -c %s "$archive") == 50408448 ]] || exit 1
                  archive_sha=$(sha256sum "$archive")
                  [[ ${archive_sha%% *} == ddc95e08b0b076efd4ea9733a3f488eb7d2be875f8834e616cd2a37358b4852d ]] || exit 1
                  printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
            - run: pnpm --filter @bento/orchestrator test:temporal-retry
              env:
                  BENTO_A6_TEMPORAL_ARCHIVE: ${{ steps.temporal-archive.outputs.archive }}
            - run: node apps/orchestrator/acceptance/temporal-retry/check-package.mjs
            - name: Remove owned Temporal archive
              if: ${{ always() }}
              shell: bash
              env:
                  TEMPORAL_ARCHIVE_DIRECTORY: ${{ steps.temporal-archive.outputs.directory }}
              run: |
                  set -euo pipefail
                  directory="$TEMPORAL_ARCHIVE_DIRECTORY"
                  [[ -n "$directory" ]] || exit 0
                  suffix=${directory#"$RUNNER_TEMP/bento-temporal."}
                  [[ "$directory" == "$RUNNER_TEMP/bento-temporal.$suffix" ]] || exit 1
                  [[ "$suffix" =~ ^[a-zA-Z0-9]{8}$ ]] || exit 1
                  [[ ! -L "$directory" ]] || exit 1
                  [[ -e "$directory" ]] || exit 0
                  [[ -d "$directory" && -O "$directory" ]] || exit 1
                  [[ $(stat -c %a "$directory") == 700 ]] || exit 1
                  rm -rf -- "$directory"
