<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bento · 账号设置</title>
        <link rel="stylesheet" href="/auth/style.css" />
    </head>
    <body>
        <main>
            <p class="brand">BENTO</p>
            <h1>账号设置</h1>
            <a href="/">返回工作区</a>
            <form method="post" action="/api/oidc/logout">
                <button>退出登录</button>
            </form>
            <form method="post" action="/api/oidc/close">
                <p>
                    注销会立即结束此 Bento
                    账号的所有会话。已提交的任务会继续执行。任务结束、待核对事项结案且未完成上传的签发地址到期后，系统会继续清理。
                </p>
                <p>项目、工作区、上传文件、任务记录和补丁清理后无法恢复。</p>
                <label
                    ><input
                        type="checkbox"
                        name="confirmed"
                        value="yes"
                        required
                    />
                    确认注销 Bento 账号并清理项目</label
                ><br />
                <button>重新认证并注销账号</button>
            </form>
        </main>
    </body>
</html>
