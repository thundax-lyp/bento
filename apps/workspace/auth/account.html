<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bento · 账号设置</title>
        <link rel="stylesheet" href="/auth/style.css" />
    </head>
    <body>
        <main>
            <p class="brand">BENTO</p>
            <h1>账号设置</h1>
            <a href="/">返回工作区</a>
            <form method="post" action="/api/oidc/logout">
                <button>退出登录</button>
            </form>
            <form method="post" action="/api/oidc/close">
                <label
                    ><input
                        type="checkbox"
                        name="confirmed"
                        value="yes"
                        required
                    />
                    确认注销 Bento 账号并清理项目</label
                ><br />
                <button>重新认证并注销账号</button>
            </form>
        </main>
    </body>
</html>
